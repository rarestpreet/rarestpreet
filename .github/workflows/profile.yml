name: Profile cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lifetime commits, languages, monthly commit history
      - run: python scripts/profile_cards.py ${{ github.repository_owner }} dist
        env:
          # Add a METRICS_TOKEN secret (classic PAT, `repo` + `read:user`) to include private repos
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff1e1e&color_dots=#161b22,#4a0000,#7a0000,#b30000,#ff1e1e
            dist/github-snake-pink.svg?color_snake=#e75480&color_dots=#fff5f8,#f9d9dd,#f5c0c7,#efadc9,#e75480

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
